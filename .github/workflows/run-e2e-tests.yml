name: Run end-to-end tests

permissions: read-all

# Nightly and on demand only. These tests share one live Bitbucket workspace,
# so running them per pull request would let concurrent runs collide, and fork
# PRs cannot read the secrets they need.
on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:

concurrency:
  group: bb-e2e
  cancel-in-progress: false

jobs:
  run-e2e-tests:
    name: End-to-end tests against the Bitbucket sandbox
    # workflow_dispatch can otherwise be pointed at any ref by anyone with
    # write access, handing the sandbox secrets to whatever code sits on that
    # ref. The schedule always runs; dispatch runs only against main. A
    # required-reviewer GitHub Environment would be the stronger gate.
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Two legs (standalone CLI, then the same suite via sdkck) at up to 2
    # minutes per test.
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 2
          # Nothing here pushes, and the default would leave GITHUB_TOKEN in
          # the workspace git config for every later step to reuse.
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          cache: npm
          node-version-file: '.nvmrc'

      - name: Install dependencies
        run: npm ci

      # The steps below are what `npm run test:e2e` does locally, split out so
      # the sweep still runs when a test fails.
      - name: Build the CLI
        run: npm run build

      # The sandbox credentials are scoped to the steps that actually talk
      # to Bitbucket, so nothing before them — actions, `npm ci` lifecycle
      # scripts, the build — ever has them in its environment.
      - name: Run end-to-end tests
        run: npm run e2e:mocha
        env:
          BITBUCKET_API_TOKEN: ${{ secrets.BITBUCKET_API_TOKEN }}
          BITBUCKET_EMAIL: ${{ secrets.BITBUCKET_EMAIL }}
          E2E_WORKSPACE: ${{ secrets.E2E_WORKSPACE }}
          E2E_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}

      # Second leg: the same suite through the latest sdkck host CLI with this
      # build packed and installed as its @hesed/bb plugin — covering the
      # `prepack` artifacts (oclif.manifest.json, README) and plugin dispatch
      # under a host. The plugin is installed before any `sdkck bb` call so
      # sdkck's first-use auto-installer cannot fetch the published release
      # over this build. The throwaway sdkck home (mktemp -d) keeps the
      # install, config and caches out of the runner's real sdkck setup; the
      # test side finds it via E2E_SDKCK_HOME.
      - name: Install the latest sdkck and the packed plugin
        run: |
          npm install --no-save sdkck
          home="$(mktemp -d)"
          echo "E2E_SDKCK_HOME=$home" >> "$GITHUB_ENV"
          # A `file:` URL is required: sdkck resolves any bare path containing
          # a slash as a GitHub org/repo. Packing into the throwaway home
          # keeps the tarball out of the workspace.
          tgz="$(npm pack --pack-destination "$home" | tail -n 1)"
          SDKCK_CACHE_DIR="$home/cache" \
          SDKCK_CONFIG_DIR="$home/config" \
          SDKCK_DATA_DIR="$home/data" \
            ./node_modules/.bin/sdkck plugins install "file:$home/$tgz"

      - name: Run end-to-end tests via sdkck
        run: npm run e2e:mocha
        env:
          BITBUCKET_API_TOKEN: ${{ secrets.BITBUCKET_API_TOKEN }}
          BITBUCKET_EMAIL: ${{ secrets.BITBUCKET_EMAIL }}
          E2E_WORKSPACE: ${{ secrets.E2E_WORKSPACE }}
          E2E_HOST_CLI: sdkck
          E2E_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          E2E_SDKCK_HOME: ${{ env.E2E_SDKCK_HOME }}

      # `always()`, so a killed mocha run (the job timeout above skips its
      # `after` hooks) still gets its fixtures reclaimed. E2E_RUN_ID is what
      # makes that possible: it pins this run's prefix so the sweep can delete
      # this run's fixtures, not just the ones older than an hour.
      - name: Sweep leftover fixtures
        if: always()
        run: npm run e2e:sweep
        env:
          BITBUCKET_API_TOKEN: ${{ secrets.BITBUCKET_API_TOKEN }}
          BITBUCKET_EMAIL: ${{ secrets.BITBUCKET_EMAIL }}
          E2E_WORKSPACE: ${{ secrets.E2E_WORKSPACE }}
          E2E_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
